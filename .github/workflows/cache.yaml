      - name: Report status to GitLab
        if: always()
        run: |
          case "${{ job.status }}" in
            success)   STATE="success" ;;
            failure)   STATE="failed" ;;
            cancelled) STATE="canceled" ;;
            *)         STATE="failed" ;;
          esac

          curl --request POST \
            --header "PRIVATE-TOKEN: ${{ secrets.GITLAB_TOKEN }}" \
            "https://gitlab.com/api/v4/projects/${{ vars.GITLAB_PROJECT_ID }}/statuses/${{ github.sha }}?state=$STATE&context=${{ github.job }}&target_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
